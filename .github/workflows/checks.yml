name: Core and localization checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  non-game:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: dotnet run --project tests/RimTube.Tests.csproj -c Release
      - run: python tools/Localization.py
      - run: python -m unittest discover -s tests -p test_external_sources.py
